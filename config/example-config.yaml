# LogIQ Agent minimal config

logging.level: debug
input_path: logs.log
checkpoint_path: checkpoint.json

http.url: http://127.0.0.1:8070/ingest
http.timeout_ms: 2000
http.connect_timeout_ms: 2000

retry.max_attempts: 10
retry.base_delay_ms: 200
retry.max_delay_ms: 10000
retry.jitter_ms: 250
retry.max_queue_batches: 256
batching.max_records: 1000
batching.max_bytes: 300
batching.flush_interval_ms: 2000
